<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none">
  <defs>
    <linearGradient id="nxtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  
  <!-- Emblem: Stylized N / Horizon Arc -->
  <g transform="translate(10, 8)">
    <rect width="54" height="54" rx="14" fill="#070D16" stroke="url(#nxtGrad)" stroke-width="1.5" />
    
    <!-- Horizon Glow Wave -->
    <path d="M 10 40 C 20 22, 34 22, 44 40" stroke="url(#arcGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Modern Geometric N -->
    <path d="M 17 38 L 17 16 L 37 38 L 37 16" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Horizon Particle Node -->
    <circle cx="27" cy="23" r="3.5" fill="#00D2FF" />
  </g>
  
  <!-- Typography: NXT HORIZON -->
  <g transform="translate(76, 20)">
    <text x="0" y="22" font-family="'Instrument Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="0.12em" fill="#FFFFFF">
      NXT<tspan fill="#00D2FF">HORIZON</tspan>
    </text>
    <text x="2" y="36" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" letter-spacing="0.26em" fill="#94A3B8">
      AI &amp; FRONTIER RESEARCH
    </text>
  </g>
</svg>
